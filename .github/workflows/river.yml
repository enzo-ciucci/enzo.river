name: Actualizar partidos de River

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (4 pedidos por corrida: bien por debajo de los 100 diarios)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar partidos
        run: python update_river.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - name: Guardar river.json
        run: |
          git config user.name "river-bot"
          git config user.email "river-bot@users.noreply.github.com"
          git add river.json
          git commit -m "Actualizar partidos" || exit 0
          git push
